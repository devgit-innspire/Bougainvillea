<!doctype html>
<html lang="%SEO_LANGUAGE%">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>%SEO_TITLE%</title>
  <meta name="description" content="%SEO_DESCRIPTION%">
  <meta name="robots" content="index, follow, max-image-preview:large, max-video-preview:-1">
  <link rel="canonical" href="%VITE_SITE_URL%/">
  <meta name="theme-color" content="%SEO_THEME_COLOR%">
  <meta name="format-detection" content="telephone=no">

  <!-- Local SEO -->
  <meta name="geo.region" content="%SEO_GEO_REGION%">
  <meta name="geo.placename" content="%SEO_GEO_PLACENAME%">
  <meta name="geo.position" content="%SEO_GEO_POSITION%">
  <meta name="ICBM" content="%SEO_ICBM%">

  <!-- Open Graph / social -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="%SEO_SITE_NAME%">
  <meta property="og:locale" content="%SEO_LOCALE%">
  <meta property="og:url" content="%VITE_SITE_URL%/">
  <meta property="og:title" content="%SEO_SOCIAL_TITLE%">
  <meta property="og:description" content="%SEO_SOCIAL_DESCRIPTION%">
  <meta property="og:image" content="%VITE_SITE_URL%/assets/img/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="%SEO_SOCIAL_IMAGE_ALT%">
  <meta property="og:video" content="%VITE_SITE_URL%/assets/video/date-nights.mp4">
  <meta property="og:video:type" content="video/mp4">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="%SEO_SOCIAL_TITLE%">
  <meta name="twitter:description" content="%SEO_SOCIAL_DESCRIPTION%">
  <meta name="twitter:image" content="%VITE_SITE_URL%/assets/img/og-image.jpg">

  <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png">
  <link rel="manifest" href="%BASE_URL%site.webmanifest">
  <link rel="sitemap" type="application/xml" href="%BASE_URL%sitemap.xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="%BASE_URL%assets/img/hero-dusk-1200.jpg" media="(max-width: 900px)">
  <link rel="preload" as="image" href="%BASE_URL%assets/img/hero-dusk.jpg" media="(min-width: 901px)">
  <!--json-ld-->
</head>
<body>
  <div id="root"><!--app-html--></div>
  <noscript>
    <p style="padding:16px;text-align:center">%SEO_NOSCRIPT_BEFORE% <a href="tel:%SEO_PHONE%">%SEO_PHONE_DISPLAY%</a> %SEO_NOSCRIPT_AFTER%</p>
  </noscript>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
